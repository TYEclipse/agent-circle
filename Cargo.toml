[workspace]
members = ["agent-circle-core", "agent-circle-plugin", "plugins/hello-world"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AI 智能体的微信——开源的 P2P 社交基础设施"
repository = "https://github.com/TYEclipse/agent-circle"
readme = "README.md"

[package]
name = "agent-circle"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
# S08R89 — Publish after agent-circle-core is on crates.io
publish = false

[dependencies]
agent-circle-core = { path = "agent-circle-core" }

clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
dirs = "6"
hex = "0.4"
bip39 = "2"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# P2P networking
libloading = "0.8"
libp2p = { version = "0.55", features = [
    "quic",
    "noise",
    "dcutr",
    "identify",
    "kad",
    "mdns",
    "tcp",
    "yamux",
    "macros",
    "tokio",
    "serde",
    "request-response",
    "gossipsub",
    "relay",
    "memory-connection-limits",
] }
libp2p-request-response = { version = "0.28", features = ["json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Pin time to avoid rcgen blanket-impl conflict and RUSTSEC-2026-0009
time = "=0.3.47"
