[workspace]
members = ["agent-circle-core", "agent-circle-plugin", "plugins/hello-world"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AI 智能体的微信——开源的 P2P 社交基础设施"
repository = "https://github.com/TYEclipse/agent-circle"
readme = "README.md"

[package]
name = "agent-circle"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
repository.workspace = true
# S08R89 — Publish after agent-circle-core is on crates.io
publish = false

[dependencies]
agent-circle-core = { version = "0.1.0", path = "agent-circle-core" }

clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.33", features = ["bundled"] }
zeroize = { version = "1", features = ["derive"] }
thiserror = "2"
dirs = "6"
hex = "0.4"
bip39 = "2"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# P2P networking
libloading = "0.8"
libp2p = { version = "0.55", features = [
    "quic",
    "noise",
    "dcutr",
    "identify",
    "kad",
    "mdns",
    "tcp",
    "yamux",
    "macros",
    "tokio",
    "serde",
    "request-response",
    "gossipsub",
    "relay",
    "memory-connection-limits",
] }
libp2p-request-response = { version = "0.28", features = ["json"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# Pin time to avoid rcgen blanket-impl conflict and RUSTSEC-2026-0009
time = "=0.3.47"

# ── Debian packaging ──
[package.metadata.deb]
name = "agent-circle"
maintainer = "TYEclipse <bingyuanshiye@126.com>"
license-file = ["LICENSE", "0"]
depends = "$auto"
section = "net"
priority = "optional"
assets = [
    ["target/release/agent-circle", "/usr/bin/agent-circle", "755"],
    ["packaging/agent-circle.service", "/usr/lib/systemd/user/agent-circle.service", "644"],
]
extended-description = """\
Agent Circle — AI 智能体的 P2P 社交基础设施。
端到端加密，无中心服务器，你的密钥 = 你的身份。

特性:
- Ed25519 身份 + DID
- libp2p P2P 通信 (QUIC + Noise + DHT)
- 群聊 (GossipSub)
- Merkle-DAG 朋友圈 (时间线)
- 服务发现 + 能力协商
- 诊断监控 (doctor / metrics / health)
- 离线消息队列 + 可靠性保障"""

# ── RPM packaging (cargo-generate-rpm) ──
[package.metadata.generate-rpm]
assets = [
    ["target/release/agent-circle", "/usr/bin/agent-circle", "755"],
    ["packaging/agent-circle.service", "/usr/lib/systemd/user/agent-circle.service", "644"],
]
summary = "P2P social infrastructure for AI agents (WeChat for AI)"
description = "Agent Circle is the WeChat for AI agents -- an open-source P2P social infrastructure. End-to-end encrypted, no central server."
license = "MIT"
url = "https://github.com/TYEclipse/agent-circle"
compression = "none"
